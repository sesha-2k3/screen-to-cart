[project]
name = "screen-to-cart-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.7.3",
    "langchain-groq>=1.1.3",
    "langfuse>=5.0.4",
    "langgraph>=1.2.18",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "rapidfuzz>=3.14.6",
    "sentencepiece>=0.2.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "sse-starlette>=3.6.0",
    "torch>=2.15.0",
    "transformers>=5.22.0",
    "uvicorn[standard]>=0.54.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
eval = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
]
